name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          sh -n plugins/aep/scripts/verify-gate.sh
          sh -n plugins/aep/scripts/session-brief.sh
          sh -n plugins/aep/scripts/record-review.sh
          sh -n plugins/aep/templates/aep-check.sh.example
          sh -n install.sh
          sh -n bench/score.sh

      - name: JSON manifests
        run: |
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
          python3 -m json.tool plugins/aep/.claude-plugin/plugin.json > /dev/null
          python3 -m json.tool plugins/aep/hooks/hooks.json > /dev/null
          echo "manifests valid"

      - name: Skill and agent frontmatter
        run: |
          python3 - <<'EOF'
          import glob, sys
          bad = []
          for f in glob.glob("plugins/aep/skills/*/SKILL.md") + glob.glob("plugins/aep/agents/*.md"):
              parts = open(f).read().split("---")
              fm = parts[1] if len(parts) > 2 else ""
              if "name:" not in fm or "description:" not in fm:
                  bad.append(f)
          if bad:
              print("missing frontmatter:", bad); sys.exit(1)
          print("frontmatter ok")
          EOF

      - name: Version consistency
        run: |
          python3 - <<'EOF'
          import json, sys
          p = json.load(open("plugins/aep/.claude-plugin/plugin.json"))["version"]
          m = json.load(open(".claude-plugin/marketplace.json"))
          mv = m["plugins"][0]["version"]
          if p != mv:
              sys.exit(f"version mismatch: plugin.json {p} vs marketplace.json {mv}")
          print("versions consistent:", p)
          EOF

      - name: Verify gate behavior
        run: |
          set -e
          REPO="$PWD"
          # Blocking review reminders are the default now; most assertions below are
          # about other behaviours, so they run with it off and the blocking path is
          # exercised explicitly where it is the subject.
          export AEP_REVIEW_BLOCK=0
          T=$(mktemp -d); cp plugins/aep/scripts/verify-gate.sh "$T/gate.sh"
          cd "$T"; git init -q -b main
          mkdir .claude
          # no check configured -> allow
          sh gate.sh; test $? -eq 0
          # failing check -> block with exit 2
          printf '#!/bin/sh\nexit 1\n' > .claude/aep-check.sh && chmod +x .claude/aep-check.sh
          set +e; sh gate.sh 2>/dev/null; RC=$?; set -e; test $RC -eq 2
          # passing check -> allow
          printf '#!/bin/sh\nexit 0\n' > .claude/aep-check.sh
          sh gate.sh; test $? -eq 0
          # green suite with suppressed tests -> allow, but surface a notice
          printf '#!/bin/sh\necho "OK (expected failures=1)"\n' > .claude/aep-check.sh
          OUT=$(sh gate.sh); test $? -eq 0
          echo "$OUT" | grep -q "suppressed tests"
          # clean green suite -> no notice at all
          printf '#!/bin/sh\necho "OK"\n' > .claude/aep-check.sh
          git add -A && git -c user.email=a@b -c user.name=a commit -qm base
          OUT=$(sh gate.sh); test -z "$OUT"
          # the gate's own inputs are watched too: an uncommitted edit to the check
          # script is surfaced, so making the gate pass by editing what it checks
          # cannot happen silently
          printf '#!/bin/sh\necho "OK" # tweaked\n' > .claude/aep-check.sh
          OUT=$(sh gate.sh); test $? -eq 0
          echo "$OUT" | grep -q "aep-check.sh"
          # and when the check also fails, the integrity note goes to stderr
          printf '#!/bin/sh\nexit 1\n' > .claude/aep-check.sh
          set +e; sh gate.sh 2>err.txt; RC=$?; set -e; test $RC -eq 2
          grep -q "gate own inputs" err.txt
          # a repository with no ledger is never asked about one
          rm -f err.txt
          git add -A && git -c user.email=a@b -c user.name=a commit -qm base2
          mkdir -p src && echo "print(1)" > src/a.py
          printf '#!/bin/sh\necho "OK"\n' > .claude/aep-check.sh
          OUT=$(sh gate.sh)
          if echo "$OUT" | grep -q "requirements ledger"; then echo "spoke with no ledger"; exit 1; fi
          printf '| ID | R | Status | Proof | Source |\n|--|--|--|--|--|\n| R1 | x | open | - | - |\n' > .claude/requirements.md
          git add -A && git -c user.email=a@b -c user.name=a commit -qm withledger
          echo "print(2)" >> src/a.py
          # by default the ledger reminder is a non-blocking note
          rm -f .git/aep-ledger-nudge
          OUT=$(sh gate.sh); test $? -eq 0
          echo "$OUT" | grep -q "requirements ledger has no row"
          # AEP_LEDGER_BLOCK=1 makes it block, exactly once
          set +e; AEP_LEDGER_BLOCK=1 sh gate.sh 2>led.txt >/dev/null; RC=$?; set -e
          test $RC -eq 2
          grep -q "AEP LEDGER" led.txt
          grep -q "committed to nothing new" led.txt
          set +e; AEP_LEDGER_BLOCK=1 sh gate.sh >/dev/null 2>&1; RC=$?; set -e
          test $RC -eq 0
          # writing a row clears it, and the next change asks again
          printf '| R2 | y | open | - | - |\n' >> .claude/requirements.md
          OUT=$(sh gate.sh)
          if echo "$OUT" | grep -q "requirements ledger"; then echo "still nagging after a row"; exit 1; fi
          git add -A && git -c user.email=a@b -c user.name=a commit -qm withrow
          echo "print(9)" >> src/a.py
          set +e; AEP_LEDGER_BLOCK=1 sh gate.sh 2>/dev/null >/dev/null; RC=$?; set -e
          test $RC -eq 2
          # the gate reports a significant diff that no fresh-context review touched
          rm -f .git/aep-reviews
          git add -A && git -c user.email=a@b -c user.name=a commit -qm base3
          mkdir -p src && echo "a=1" > src/a.py && echo "b=1" > src/b.py
          git add -A && git -c user.email=a@b -c user.name=a commit -qm src
          echo "a=2" >> src/a.py
          OUT=$(sh gate.sh)
          if echo "$OUT" | grep -q "no fresh-context review"; then echo "a three-line change should be below the threshold"; exit 1; fi
          # one heavily rewritten file counts as significant on its own
          python3 -c "open('src/a.py','a').write(chr(10).join(f'z{i}={i}' for i in range(30)))"
          OUT=$(sh gate.sh); echo "$OUT" | grep -q "no fresh-context review"
          git checkout -- src/a.py
          echo "a=2" >> src/a.py
          echo "b=2" >> src/b.py
          # blocking is the default: unset the override and it blocks once
          set +e; (unset AEP_REVIEW_BLOCK; sh gate.sh) 2>rev0.txt >/dev/null; RC=$?; set -e
          test $RC -eq 2; grep -q "AEP REVIEW" rev0.txt
          # with the override off it degrades to the notice
          OUT=$(sh gate.sh); echo "$OUT" | grep -q "no fresh-context review"
          # a recorded review after the last commit silences it
          sleep 1
          # a subagent that is not a reviewer does not count
          printf '{"agent_type":"general-purpose"}' | sh "$REPO/plugins/aep/scripts/record-review.sh"
          OUT=$(sh gate.sh); echo "$OUT" | grep -q "no fresh-context review"
          printf '{"agent_type":"aep:adversarial-reviewer"}' | sh "$REPO/plugins/aep/scripts/record-review.sh"
          OUT=$(sh gate.sh)
          if echo "$OUT" | grep -q "no fresh-context review"; then echo "a recorded review was ignored"; exit 1; fi
          # asked once per commit, then it lets go
          git add -A && git -c user.email=a@b -c user.name=a commit -qm reviewed1
          python3 -c "open('src/c.py','w').write(chr(10).join(f'q{i}={i}' for i in range(30)))"
          set +e; (unset AEP_REVIEW_BLOCK; sh gate.sh) 2>rev.txt >/dev/null; RC=$?; set -e
          test $RC -eq 2; grep -q "AEP REVIEW" rev.txt
          set +e; (unset AEP_REVIEW_BLOCK; sh gate.sh) >/dev/null 2>&1; RC=$?; set -e
          test $RC -eq 0
          rm -f src/c.py

          # a session that commits its work is still asked: clean tree falls back to HEAD
          git add -A && git -c user.email=a@b -c user.name=a commit -qm committedwork
          python3 -c "open('src/d.py','w').write(chr(10).join(f'w{i}={i}' for i in range(30)))"
          git add -A && git -c user.email=a@b -c user.name=a commit -qm "d module"
          OUT=$(sh gate.sh); echo "$OUT" | grep -q "no fresh-context review"

          # an old commit is not this session's work
          python3 -c "open('src/e.py','w').write(chr(10).join(f'e{i}={i}' for i in range(40)))"
          git add -A
          GIT_AUTHOR_DATE="2025-01-02T10:00:00" GIT_COMMITTER_DATE="2025-01-02T10:00:00" git -c user.email=a@b -c user.name=a commit -qm "old work"
          OUT=$(sh gate.sh)
          if echo "$OUT" | grep -q "no fresh-context review"; then echo "blamed the session for a 2025 commit"; exit 1; fi

          # test-only changes never trigger it
          git add -A; git -c user.email=a@b -c user.name=a commit -qm reviewed || true
          sleep 1
          printf '{"agent_type":"aep:adversarial-reviewer"}' | sh "$REPO/plugins/aep/scripts/record-review.sh"
          mkdir -p tests && echo "x=1" > tests/test_a.py && echo "y=1" > tests/test_b.py
          OUT=$(sh gate.sh)
          if echo "$OUT" | grep -q "no fresh-context review"; then echo "complained about tests"; exit 1; fi
          echo "gate behavior ok"

      - name: Session brief behavior
        run: |
          set -e
          REPO="$PWD"
          T=$(mktemp -d); cd "$T"; git init -q -b main; echo x > a.txt
          B="$REPO/plugins/aep/scripts/session-brief.sh"
          # silent where there is no AEP state
          OUT=$(sh "$B"); test -z "$OUT"
          # speaks, as valid SessionStart JSON, where there is
          mkdir .claude
          printf '| ID | R | Status | Proof | Source |\n|--|--|--|--|--|\n| R1 | a | open | - | - |\n| R2 | b | done | t | - |\n' > .claude/requirements.md
          OUT=$(sh "$B")
          echo "$OUT" | grep -q '"hookEventName":"SessionStart"'
          echo "$OUT" | grep -q '1 done, 1 open'
          echo "$OUT" | python3 -c 'import json,sys; json.load(sys.stdin)'
          # never blocks: exit 0 even on a malformed ledger
          printf 'not a table at all\n' > .claude/requirements.md
          sh "$B" > /dev/null; test $? -eq 0
          echo "session brief behavior ok"

      - name: Traceability checker behavior
        run: |
          set -e
          REPO="$PWD"
          T=$(mktemp -d); cd "$T"
          mkdir -p .claude/specs src
          cp "$REPO/plugins/aep/templates/trace.py.example" .claude/trace.py
          echo "def upload_guard(): pass  # test_upload_rejects_oversize" > src/app.py
          echo "spec" > .claude/specs/upload.md
          L=.claude/requirements.md
          hdr() { printf '| ID | Requirement | Status | Proof | Source |\n|----|----|----|----|----|\n' > $L; }
          run() { set +e; python3 .claude/trace.py > out.txt 2>&1; RC=$?; set -e; }

          # missing ledger -> fail
          run; test $RC -eq 1; grep -q "no requirements ledger" out.txt

          # healthy ledger (done+open+deferred+dropped) -> pass
          hdr
          printf '| R1 | Oversize uploads rejected | done | test_upload_rejects_oversize | .claude/specs/upload.md |\n' >> $L
          printf '| R2 | Tenant limits | open | - | - |\n' >> $L
          printf '| R3 | Backoff | deferred 2026-09-14 - single tenant until the pilot closes | - | - |\n' >> $L
          printf '| R4 | XML export | dropped 2026-09-14 - no consumer asked twice | - | - |\n' >> $L
          run; test $RC -eq 0; grep -q "traceability OK" out.txt

          # a done row whose proof left the tree -> fail
          hdr; printf '| R1 | Oversize uploads rejected | done | test_that_was_deleted | .claude/specs/upload.md |\n' >> $L
          run; test $RC -eq 1; grep -q "gone stale" out.txt

          # a deferral with no date and no reason -> fail
          hdr; printf '| R1 | Tenant limits | deferred | - | - |\n' >> $L
          run; test $RC -eq 1; grep -q "deferred without a date and a reason" out.txt

          # a date with no reason -> fail (the reason must be in the status cell)
          hdr; printf '| R1 | Tenant limits | deferred 2026-09-14 | - | - |\n' >> $L
          run; test $RC -eq 1; grep -q "deferred without a date and a reason" out.txt

          # a date that only appears in the requirement text -> fail
          hdr; printf '| R1 | Ship by 2026-09-14 hopefully | deferred | - | - |\n' >> $L
          run; test $RC -eq 1; grep -q "deferred without a date and a reason" out.txt

          # proof matching is word-bounded: a renamed symbol must not satisfy the row
          echo "GATE_SENTINEL_RENAMED = 1" > src/renamed.py
          hdr; printf '| R1 | Tamper visibility | done | GATE_SENTINEL | - |\n' >> $L
          run; test $RC -eq 1; grep -q "gone stale" out.txt
          echo "GATE_SENTINEL = 1" >> src/renamed.py
          run; test $RC -eq 0

          # a test-shaped proof is run, not just located: a row claiming done while
          # its own test is red must fail
          printf 'import unittest\n\nclass T(unittest.TestCase):\n    def test_green(self):\n        self.assertTrue(True)\n    def test_red(self):\n        self.assertEqual(1, 2)\n' > test_things.py
          hdr; printf '| R1 | A | done | test_green | - |\n' >> $L
          run; test $RC -eq 0
          grep -q "were run, not just located" out.txt
          hdr; printf '| R1 | A | done | test_red | - |\n' >> $L
          run; test $RC -eq 1; grep -q "proof exists but FAILS" out.txt
          # and the escape hatch puts it back to locating them
          set +e; AEP_TRACE_NO_RUN=1 python3 .claude/trace.py > out.txt 2>&1; RC=$?; set -e
          test $RC -eq 0; grep -q "existence only" out.txt
          rm -f test_things.py

          # a row that is not five cells is a failure, not silently skipped
          hdr; printf '| R1 | A | open | - | - |\n| R2 | B | done | test_that_never_existed |\n' >> $L
          run; test $RC -eq 1; grep -q "malformed row" out.txt

          # an escaped pipe stays inside its cell
          hdr; printf '| R1 | A | done | cmd: echo ok \\| grep -q ok | - |\n' >> $L
          run; test $RC -eq 0

          # command proofs: failing -> fail, passing -> pass
          hdr; printf '| R1 | Budget respected | done | cmd: exit 3 | - |\n' >> $L
          run; test $RC -eq 1; grep -q "proof command failed (exit 3)" out.txt
          hdr; printf '| R1 | Budget respected | done | cmd: true | - |\n' >> $L
          run; test $RC -eq 0

          # AEP_TRACE_NO_CMD=1 -> command proofs skipped, but named as unverified
          hdr; printf '| R1 | Budget respected | done | cmd: exit 3 | - |\n' >> $L
          set +e; AEP_TRACE_NO_CMD=1 python3 .claude/trace.py > out.txt 2>&1; RC=$?; set -e
          test $RC -eq 0; grep -q "UNVERIFIED" out.txt; grep -q "NOT executed" out.txt

          # table integrity: duplicate id, unknown status, missing source, done without proof
          hdr; printf '| R1 | A | open | - | - |\n| R1 | B | open | - | - |\n' >> $L
          run; test $RC -eq 1; grep -q "duplicate ID" out.txt
          hdr; printf '| R1 | A | maybe | - | - |\n' >> $L
          run; test $RC -eq 1; grep -q "unknown status" out.txt
          hdr; printf '| R1 | A | open | - | .claude/specs/nope.md |\n' >> $L
          run; test $RC -eq 1; grep -q "source not found" out.txt
          hdr; printf '| R1 | A | done | - | - |\n' >> $L
          run; test $RC -eq 1; grep -q "done without a proof" out.txt
          hdr; printf '| R1 | A | done | cmd: | - |\n' >> $L
          run; test $RC -eq 1; grep -q "empty cmd" out.txt

          echo "traceability checker behavior ok (21 scenarios)"

      - name: Installer behavior
        run: |
          set -e
          REPO="$PWD"
          T=$(mktemp -d); cd "$T"
          sh "$REPO/install.sh" agents-md > first.log
          test -f AGENTS.md
          test -f .claude/requirements.md
          test -f .claude/trace.py
          test -f .claude/aep-check.sh
          # the scaffold works out of the box, and the check it installs really
          # runs the traceability checker rather than only recommending it
          python3 .claude/trace.py | grep -q "traceability OK"
          sh -n .claude/aep-check.sh
          sh .claude/aep-check.sh > /dev/null
          printf '| R2 | X | done | proof_that_does_not_exist | - |\n' >> .claude/requirements.md
          set +e; sh .claude/aep-check.sh > /dev/null 2>&1; RC=$?; set -e
          test $RC -eq 1
          git checkout -- .claude/requirements.md 2>/dev/null || sed -i.bak '$d' .claude/requirements.md
          # a second run overwrites nothing
          echo "local edit" >> .claude/requirements.md
          sh "$REPO/install.sh" agents-md > second.log
          grep -q "not overwriting" second.log
          grep -q "local edit" .claude/requirements.md
          # skills install for Agent Skills-standard tools
          sh "$REPO/install.sh" skills ./skills-out > /dev/null
          test -f ./skills-out/protocol/SKILL.md
          test -f ./skills-out/verify/SKILL.md
          echo "installer behavior ok"

      - name: Eval suite structure
        run: |
          set -e
          python3 - <<'EOF'
          import glob, os, re, sys
          cases = sorted({os.path.dirname(p) for p in
                          glob.glob("plugins/aep/evals/*/prompt.md") +
                          glob.glob("plugins/aep/evals/*/case.yaml")})
          if len(cases) < 4:
              sys.exit(f"expected at least 4 eval cases, found {len(cases)}: {cases}")
          FRONT = re.compile(r"\A---\n(.*?)\n---\n", re.S)
          TYPES = {"regex", "tool_used", "tool_order", "file_exists", "llm", "baseline"}
          problems = []
          for c in cases:
              graders = glob.glob(os.path.join(c, "graders", "*.md"))
              if not graders:
                  problems.append(f"{c}: no graders")
              for g in graders:
                  m = FRONT.match(open(g).read())
                  if not m:
                      problems.append(f"{g}: no frontmatter"); continue
                  fm = m.group(1)
                  tm = re.search(r"^type:\s*(\S+)", fm, re.M)
                  if not tm or tm.group(1) not in TYPES:
                      problems.append(f"{g}: bad or missing grader type")
              sc = os.path.join(c, "scaffold.sh")
              if os.path.exists(sc) and not os.access(sc, os.X_OK):
                  problems.append(f"{sc}: not executable")
              cy = os.path.join(c, "case.yaml")
              if os.path.exists(cy):
                  y = open(cy).read()
                  if 'schema_version: "1.1"' not in y or "name:" not in y:
                      problems.append(f"{cy}: missing schema_version or name")
                  if "scaffold_script" in y and not os.path.exists(sc):
                      problems.append(f"{cy}: names a scaffold_script that does not exist")
          if problems:
              print("\n".join(problems)); sys.exit(1)
          print(f"eval suite ok: {len(cases)} cases")
          EOF
          for f in plugins/aep/evals/*/scaffold.sh; do bash -n "$f"; done
          echo "scaffolds parse"

      - name: Bench sequence fixture
        run: |
          set -e
          cd bench/sequence
          sh -n score.sh
          test "$(ls tickets/*.txt | wc -l | tr -d ' ')" -eq 6
          ( cd repo && python3 -m unittest -q 2>&1 | tail -1 | grep -q OK )
          # the scorer must be able to tell the two orderings apart, or it measures nothing
          T=$(mktemp -d)
          for order in before after; do
            mkdir -p "$T/$order"; cp repo/test_pricing.py repo/Makefile "$T/$order/"
            if [ "$order" = before ]; then
              printf 'def line_total(i): return i["unit_price"]*i["qty"]\ndef subtotal(x): return sum(line_total(i) for i in x)\ndef amount_due(items, discount=0, tax_rate=0.0, credit=0.0):\n    b = subtotal(items)*(1-discount/100)\n    return max(b-credit, 0.0)*(1+tax_rate)\n' > "$T/$order/pricing.py"
            else
              printf 'def line_total(i): return i["unit_price"]*i["qty"]\ndef subtotal(x): return sum(line_total(i) for i in x)\ndef amount_due(items, discount=0, tax_rate=0.0, credit=0.0):\n    b = subtotal(items)*(1-discount/100)*(1+tax_rate)\n    return max(b-credit, 0.0)\n' > "$T/$order/pricing.py"
            fi
          done
          sh score.sh "$T/before" | grep -q "credit before tax (75.60)"
          sh score.sh "$T/after"  | grep -q "credit after tax (76.40)"
          echo "sequence fixture ok"

      - name: Validation log index
        run: python3 .claude/proofs/r18_log_index.py

      - name: Validation log counts
        run: python3 .claude/proofs/r19_log_counts.py

      - name: Claude plugin validate
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
